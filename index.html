<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Format Converter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      width: 500px;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #292929;
      color: white;
      outline: none;
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    #convert {
      background: #2563eb;
      color: white;
    }

    #copy {
      background: #333;
      color: white;
    }

    #output {
      margin-top: 15px;
      padding: 14px;
      background: #090909;
      border-radius: 7px;
      word-break: break-all;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Format Converter</h2>

  <textarea
    id="input"
    placeholder="Put Data here
    
    "
    autocomplete="off"
  ></textarea>
  <button id="convert" onclick="convertData()">Convert</button>
  <div id="output"></div>
  <button id="copy" onclick="copyResult()">Copy Result</button>
</div>
<script>
function convertData() {
  const input = document.getElementById("input").value.trim();
  const output = document.getElementById("output");

  if (!input) {
    output.textContent = "Please enter data.";
    return;
  }
  let number, month, year, code;
  const normalMatch = input.match(
    /^(\d+)\s+(\d{1,2})\/(\d{2,4})\s+(\d+)$/
  );

  if (normalMatch) {
    [, number, month, year, code] = normalMatch;
  }
  if (!normalMatch) {

    const ccMatch = input.match(
      /(?:^|\n)\s*[-*]?\s*cc\s*:\s*(\d+)/i
    );

    const expMatch = input.match(
      /(?:^|\n)\s*[-*]?\s*exp\s*:\s*(\d{1,2})\s*\/\s*(\d{2,4})/i
    );

    const cvvMatch = input.match(
      /(?:^|\n)\s*[-*]?\s*cvv\s*:\s*(\d+)/i
    );

    if (ccMatch && expMatch && cvvMatch) {
      number = ccMatch[1];
      month = expMatch[1];
      year = expMatch[2];
      code = cvvMatch[1];
    }
  }

  if (!number || !month || !year || !code) {
    output.textContent = "Invalid format.";
    return;
  }

  month = month.padStart(2, "0");

  const result = `${number}|${month}|${year}|${code}`;

  output.textContent = result;
}

function copyResult() {
  const output = document.getElementById("output").textContent;

  if (
    !output ||
    output === "Invalid format." ||
    output === "Please enter data."
  ) {
    return;
  }

  navigator.clipboard.writeText(output);
}

// Ctrl + Enter = Convert
document.getElementById("input").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && event.ctrlKey) {
    convertData();
  }
});
</script>

</body>
</html>
